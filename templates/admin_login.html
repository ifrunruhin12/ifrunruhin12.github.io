<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin · {{.Site.SiteTitle}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <div class="header-row">
        <img class="site-icon" src="{{.Site.LogoURL}}" width="42" height="42" alt="" decoding="async">
        <h1>{{.Site.DisplayName}}</h1>
    </div>
    <nav>
        <a href="/index.html">Home</a><span class="nav-sep">|</span><a href="/about.html">About</a>
    </nav>
</header>

<section class="login-box">
    <h2>Admin</h2>
    <p class="admin-hint">Set <code>ADMIN_PASSWORD</code> in the environment, then sign in. This URL is not linked anywhere on the public site.</p>
    <form method="POST" action="/admin/login">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
        <button type="submit" class="admin-btn">Sign in</button>
    </form>
</section>

<script src="/static/app.js" defer></script>
</body>
</html>
